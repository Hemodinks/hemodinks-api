extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://localhost:5173
            - http://127.0.0.1:5173
          allowed_headers:
            - "*"
          max_age: 7200

processors:
  batch:

exporters:
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls:
      insecure: true

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/aspire
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/aspire
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/aspire
