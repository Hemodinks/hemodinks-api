# Atualiza as GitHub Actions pinadas por SHA (#222). PRs vão para developer, agrupados por semana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
