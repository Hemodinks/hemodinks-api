# Atualiza as GitHub Actions pinadas por SHA (#222) e os pacotes NuGet (#286). PRs vão para developer, por semana.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)

  # NuGet (#286): versões centrais em Directory.Packages.props. Minor/patch num PR semanal;
  # major em PR próprio, para revisão isolada. O gate de vulnerabilidades roda no CI.
  # O Dependabot não regenera os packages.lock.json: veja docs/nuget-vulnerability-gate.md.
  - package-ecosystem: nuget
    directory: /
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major de pacotes da plataforma acompanha o TargetFramework (.NET 10 LTS); sobe junto, por decisão explícita.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Aspire.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      # MediatR 13+ tem licença comercial (AGENTS.md regra 7: sem dependência paga).
      - dependency-name: "MediatR"
        versions: [">=13.0.0"]
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  # #372: imagens base dos Dockerfiles (API e SQL Server de teste). O gate Trivy roda no publish.
  - package-ecosystem: docker
    directories:
      - /
      - /sqlserver
    target-branch: developer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Major das imagens .NET acompanha o TargetFramework (net10.0, LTS): runtime 11 nao executa a API
      # (framework 10.0 ausente, PR #415) e SDK 11 descasa do CI. Sobe junto com o TargetFramework, por decisao explicita.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      # SQL Server de dev/CI: o Dockerfile.fts instala o Full-Text do repositorio do 2022 (Ubuntu 22.04);
      # o 2025 quebra a instalacao (PR #417). Trocar de versao exige refazer o Dockerfile.fts.
      - dependency-name: "mssql/server"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
