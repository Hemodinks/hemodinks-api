name: CI

on:
  push:
    branches:
      - main
      - developer
      - dev-local
  pull_request:
    branches:
      - main
      - developer
      - dev-local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SQL Server for relational tests
        shell: bash
        run: |
          test_password="Test_${GITHUB_RUN_ID}_Aa!"
          docker run --detach --name hemodinks-test-sqlserver \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$test_password" \
            --publish 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          for attempt in {1..30}; do
            if docker exec hemodinks-test-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$test_password" -C -Q "SELECT 1" \
              > /dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs hemodinks-test-sqlserver
              exit 1
            fi

            sleep 2
          done

          echo "HEMODINKS_TEST_SQLSERVER_CONNECTION_STRING=Server=localhost,1433;User ID=sa;Password=$test_password;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./HemodinksAPI.slnx

      - name: Build
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Validate migrations (dev-local)
        if: github.ref_name == 'dev-local' || github.base_ref == 'dev-local'
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -Configuration Release

      - name: Validate migrations
        if: github.ref_name != 'dev-local' && github.base_ref != 'dev-local'
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -NoBuild -Configuration Release

      - name: Test
        run: dotnet test ./HemodinksAPI.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
