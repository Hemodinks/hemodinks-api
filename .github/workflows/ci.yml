name: CI

on:
  push:
    branches:
      - main
      - developer
      - dev-local
  pull_request:
    branches:
      - main
      - developer
      - dev-local
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./HemodinksAPI.slnx

      - name: Build
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Validate migrations (dev-local)
        if: github.ref_name == 'dev-local' || github.base_ref == 'dev-local'
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1

      - name: Validate migrations
        if: github.ref_name != 'dev-local' && github.base_ref != 'dev-local'
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -NoBuild

      - name: Test
        run: dotnet test ./HemodinksAPI.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
