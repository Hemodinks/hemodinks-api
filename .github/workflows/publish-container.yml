name: Publish Production

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Deploy the published SHA images to Production
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-container-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  API_NAME: hemodinks-api-prod
  API_RESOURCE_GROUP: rg-hemodinks-prod
  API_IMAGE: ghcr.io/hemodinks/hemodinks-api:sha-${{ github.sha }}

jobs:
  login-e2e:
    name: Login integration E2E
    permissions:
      contents: read
    uses: ./.github/workflows/login-e2e.yml

  validate:
    name: Restore, build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test trusted proxy configuration
        run: python3 -B -m unittest discover -s scripts/tests -p test_forwarded_headers.py -v

      - name: Test Production approval and rollback gates without Azure
        run: python3 -B -m unittest discover -s scripts/tests -p test_production_deployment_gates.py -v

      - name: Test bootstrap proxy payload without Azure
        shell: pwsh
        run: ./scripts/tests/test_bootstrap_proxy.ps1

      # Antes so no CI, que nao roda mais no push da main (#221).
      - name: Test SQL identity separation without database access
        run: python3 -B -m unittest discover -s scripts/tests -p test_sql_identity_separation.py -v

      - name: Test Functions network restriction rules without Azure
        run: python3 -B -m unittest discover -s scripts/tests -p test_functions_network_restrictions.py -v

      - name: Test GitHub Actions pinned by SHA
        run: python3 -B -m unittest discover -s scripts/tests -p test_actions_pinned.py -v

      - name: Test result gate regressions
        run: python3 -B -m unittest discover -s scripts/tests -p test_test_results_gate.py -v

      - name: Start SQL Server for relational tests
        shell: bash
        run: |
          test_password="Test_${GITHUB_RUN_ID}_Aa!"
          docker build \
            --file sqlserver/Dockerfile.fts \
            --tag hemodinks-sqlserver:2022-fts-ci \
            .

          docker run --detach --name hemodinks-test-sqlserver \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$test_password" \
            --publish 1433:1433 \
            hemodinks-sqlserver:2022-fts-ci

          for attempt in {1..30}; do
            if docker exec hemodinks-test-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$test_password" -C -Q "SELECT 1" \
              > /dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs hemodinks-test-sqlserver
              exit 1
            fi

            sleep 2
          done

          echo "HEMODINKS_TEST_SQLSERVER_CONNECTION_STRING=Server=localhost,1433;User ID=sa;Password=$test_password;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./HemodinksAPI.slnx --locked-mode

      - name: Build
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ./HemodinksAPI.slnx --configuration Release --no-build --filter "FullyQualifiedName!~LoginBrowserTests" --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Require critical SQL tests and zero silent skips
        if: always()
        run: python3 -B scripts/check-test-results.py --suite api TestResults/test-results.trx

      - name: Audit migrations and pending model changes
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -NoBuild -Configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-test-results-${{ github.sha }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Build and publish ${{ matrix.service }} SHA image
    needs: [validate, login-e2e]
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: ./Dockerfile
            image: ghcr.io/hemodinks/hemodinks-api

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  prepare-migrations:
    name: Build migration bundle and audited SQL
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore ./HemodinksAPI.slnx --locked-mode

      - name: Build migration projects
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Generate Linux migration bundle and idempotent SQL
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations bundle \
            --context AppDbContext \
            --self-contained \
            --target-runtime linux-x64 \
            --configuration Release \
            --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-efbundle
          dotnet tool run dotnet-ef migrations script \
            --context AppDbContext \
            --idempotent \
            --configuration Release \
            --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-production-migrations.sql
          chmod +x ./artifacts/hemodinks-efbundle

      - name: Package read-only SQL verifier
        run: dotnet publish tools/Hemodinks.SchemaGuard/Hemodinks.SchemaGuard.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/schema-guard

      - name: Upload migration artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-migrations-${{ github.sha }}
          path: |
            artifacts/hemodinks-efbundle
            artifacts/hemodinks-production-migrations.sql
            artifacts/schema-guard/
          if-no-files-found: error
          retention-days: 30

  migrate-production:
    name: Approve Production release and migrate once
    needs:
      - publish
      - prepare-migrations
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      forwarded_headers_env: ${{ steps.proxy.outputs.environment }}

    steps:
      - name: Checkout proxy preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure for ingress preflight
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension for preflight
        run: az extension add --name containerapp --upgrade

      - name: Validate trusted ingress before migrations
        id: proxy
        env:
          API_FORWARDED_HEADERS_KNOWN_PROXIES: ${{ vars.API_FORWARDED_HEADERS_KNOWN_PROXIES }}
          API_FORWARDED_HEADERS_KNOWN_NETWORKS: ${{ vars.API_FORWARDED_HEADERS_KNOWN_NETWORKS }}
        run: |
          set -euo pipefail
          az containerapp show --name "$API_NAME" --resource-group "$API_RESOURCE_GROUP" \
            --query '{name:name,resourceGroup:resourceGroup,properties:{configuration:{ingress:properties.configuration.ingress}}}' -o json \
            | python3 -B scripts/forwarded_headers.py --azure-app-config --github-output "$GITHUB_OUTPUT"

      - name: Download reviewed migration bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-migrations-${{ github.sha }}
          path: artifacts

      - name: Verify migration secret
        env:
          CONNECTION_CONFIGURED: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION_STRING != '' }}
        run: |
          if [ "$CONNECTION_CONFIGURED" != "true" ]; then
            echo "::error::Configure AZURE_SQL_MIGRATION_CONNECTION_STRING in the production Environment."
            exit 2
          fi

      - name: Validate SQL deployment identities without connecting
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_RUNTIME_CONNECTION_STRING }}
          HEMODINKS_SQL_MIGRATION_CONNECTION_STRING: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION_STRING }}
        run: |
          chmod +x artifacts/schema-guard/Hemodinks.SchemaGuard
          ./artifacts/schema-guard/Hemodinks.SchemaGuard --validate-connections

      - name: Verify SQL runtime privileges and history
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_RUNTIME_CONNECTION_STRING }}
        run: |
          set +e
          ./artifacts/schema-guard/Hemodinks.SchemaGuard
          schema_status=$?
          set -e
          case "$schema_status" in
            0|10) ;;
            *) echo "::error::Runtime privilege or schema verification failed; migration blocked."; exit "$schema_status" ;;
          esac

      - name: Apply migration bundle
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION_STRING }}
        run: |
          chmod +x ./artifacts/hemodinks-efbundle
          for attempt in $(seq 1 5); do
            if ./artifacts/hemodinks-efbundle; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Migration bundle failed after ${attempt} attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Migration attempt ${attempt}/5 failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Verify SQL runtime after migration
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_RUNTIME_CONNECTION_STRING }}
        run: ./artifacts/schema-guard/Hemodinks.SchemaGuard

      - name: Migration summary
        if: always()
        env:
          MIGRATION_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production migration"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bundle: \`production-migrations-${GITHUB_SHA}\`"
            echo "- Result: **${MIGRATION_STATUS}**"
            echo "- Executed once by job: \`${GITHUB_JOB}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Switch API Blue/Green
    needs: migrate-production
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout revision policy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Validate exact Production target
        run: bash scripts/deploy/validate-production-target.sh
      - name: Ensure Production Container App is running
        run: bash scripts/deploy/ensure-container-app-running.sh
      - name: Create candidate revision with zero traffic
        id: candidate
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          FORWARDED_HEADERS_ENV: ${{ needs.migrate-production.outputs.forwarded_headers_env }}
        run: bash scripts/deploy/create-candidate-revision.sh
      - name: Warm up and smoke test candidate
        timeout-minutes: 12
        id: smoke
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          CANDIDATE_FQDN: ${{ steps.candidate.outputs.candidate_fqdn }}
        run: bash scripts/deploy/smoke-test-candidate.sh
      - name: Promote candidate and verify Production traffic
        id: promotion
        env:
          ALREADY_CURRENT: ${{ steps.candidate.outputs.already_current }}
          ACTIVE_LABEL: ${{ steps.candidate.outputs.active_label }}
          CANDIDATE_LABEL: ${{ steps.candidate.outputs.candidate_label }}
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
        run: bash scripts/deploy/promote-candidate.sh
      - name: Enforce CURRENT/PREVIOUS revision policy
        if: steps.candidate.outputs.already_current != 'true'
        id: cleanup
        env:
          CURRENT_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
        run: |
          bash scripts/Enforce-ProductionRevisionPolicy.sh \
            "$CURRENT_REVISION" \
            "$PREVIOUS_REVISION"

      - name: Deployment summary
        if: always()
        env:
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          ACTIVE_LABEL: ${{ steps.candidate.outputs.candidate_label }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result || 'failed/not-run' }}
          PROMOTION_RESULT: ${{ steps.promotion.outputs.result || 'failed/not-run' }}
          ROLLBACK_RESULT: ${{ steps.promotion.outputs.rollback_result || 'not-run' }}
          REVISION_POLICY: ${{ steps.candidate.outputs.already_current == 'true' && 'unchanged/already-current' || steps.cleanup.outputs.status || 'not-run' }}
          ACTIVE_REVISION_COUNT: ${{ steps.cleanup.outputs.active_count || 'unknown' }}
          OLD_REVISIONS_DEACTIVATED: ${{ steps.cleanup.outputs.old_revisions_deactivated || '0' }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: bash scripts/deploy/write-deployment-summary.sh

  # Unico caminho de deploy dos Workers (#228): pacote de codigo na Function App (Flex Consumption).
  deploy-function-app:
    name: Deploy Workers to Azure Function App
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure }}

    steps:
      - name: Require Workers Function App target
        env:
          WORKERS_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_WORKERS_NAME }}
        run: |
          if [ -z "$WORKERS_FUNCTION_APP_NAME" ]; then
            echo "::error::AZURE_FUNCTION_APP_WORKERS_NAME is not set; Workers would not be deployed with this release."
            exit 4
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Publish workers
        run: dotnet publish HemodinksAPI.Workers/HemodinksAPI.Workers.csproj --configuration Release --output ./publish/workers

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy workers
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_WORKERS_NAME }}
          package: ./publish/workers
