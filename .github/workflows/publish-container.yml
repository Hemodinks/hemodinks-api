name: Publish Containers

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Deploy the published images to Azure Container Apps
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: ./Dockerfile
            image: ghcr.io/hemodinks/hemodinks-api
          - service: functions
            dockerfile: ./HemodinksAPI.Workers/Dockerfile
            image: ghcr.io/hemodinks/hemodinks-api-workers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-api:
    name: Deploy API to Azure Container Apps
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.AZURE_CONTAINER_APPS_DEPLOY_ENABLED == 'true' && vars.AZURE_CONTAINER_APP_API_NAME != '' && (vars.AZURE_CONTAINER_APP_API_RESOURCE_GROUP != '' || vars.AZURE_RESOURCE_GROUP != '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure)) }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Update API image
        run: |
          api_name="${{ vars.AZURE_CONTAINER_APP_API_NAME }}"
          resource_group="${{ vars.AZURE_CONTAINER_APP_API_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}"

          if ! az containerapp show --name "$api_name" --resource-group "$resource_group" >/dev/null 2>&1; then
            echo "Container App '$api_name' not found in Resource Group '$resource_group'. Searching current subscription..."
            resource_group="$(az containerapp list --query "[?name=='$api_name'].resourceGroup | [0]" -o tsv 2>/dev/null || true)"
          fi

          if [ -z "$resource_group" ] || [ "$resource_group" = "None" ]; then
            echo "::error::Container App '$api_name' was not found. Update AZURE_RESOURCE_GROUP or grant the deployment identity access to the new Resource Group."
            exit 3
          fi

          echo "Deploying API Container App '$api_name' in Resource Group '$resource_group'."
          az containerapp update \
            --name "$api_name" \
            --resource-group "$resource_group" \
            --image "ghcr.io/hemodinks/hemodinks-api:sha-${{ github.sha }}" \
            --set-env-vars Deployment__CommitSha="${{ github.sha }}"

  deploy-functions:
    name: Deploy Functions to Azure Container Apps
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.AZURE_CONTAINER_APPS_DEPLOY_ENABLED == 'true' && vars.AZURE_CONTAINER_APP_FUNCTIONS_NAME != '' && (vars.AZURE_CONTAINER_APP_FUNCTIONS_RESOURCE_GROUP != '' || vars.AZURE_RESOURCE_GROUP != '') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure)) }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Update Functions image
        run: |
          functions_name="${{ vars.AZURE_CONTAINER_APP_FUNCTIONS_NAME }}"
          resource_group="${{ vars.AZURE_CONTAINER_APP_FUNCTIONS_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}"

          if ! az containerapp show --name "$functions_name" --resource-group "$resource_group" >/dev/null 2>&1; then
            echo "Container App '$functions_name' not found in Resource Group '$resource_group'. Searching current subscription..."
            resource_group="$(az containerapp list --query "[?name=='$functions_name'].resourceGroup | [0]" -o tsv 2>/dev/null || true)"
          fi

          if [ -z "$resource_group" ] || [ "$resource_group" = "None" ]; then
            echo "::error::Container App '$functions_name' was not found. Update AZURE_RESOURCE_GROUP or grant the deployment identity access to the new Resource Group."
            exit 3
          fi

          echo "Deploying Functions Container App '$functions_name' in Resource Group '$resource_group'."
          az containerapp update \
            --name "$functions_name" \
            --resource-group "$resource_group" \
            --image "ghcr.io/hemodinks/hemodinks-api-workers:sha-${{ github.sha }}" \
            --set-env-vars Deployment__CommitSha="${{ github.sha }}"

  deploy-function-app:
    name: Deploy Workers to Azure Function App
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.AZURE_FUNCTION_APP_WORKERS_NAME != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish workers
        run: dotnet publish HemodinksAPI.Workers/HemodinksAPI.Workers.csproj --configuration Release --output ./publish/workers

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy workers
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_WORKERS_NAME }}
          package: ./publish/workers
