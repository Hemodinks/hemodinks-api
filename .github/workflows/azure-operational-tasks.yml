name: Azure Operational Tasks

on:
  workflow_dispatch:
    inputs:
      task:
        description: Operational task to run
        required: true
        type: choice
        default: cbhpm-seed
        options:
          - cbhpm-seed
      container_app_name:
        description: Optional Container App name; defaults to AZURE_CONTAINER_APP_API_NAME
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-container-publish
  cancel-in-progress: false

jobs:
  cbhpm-seed:
    name: Run CBHPM seed on Azure Container Apps
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    if: ${{ inputs.task == 'cbhpm-seed' }}

    steps:
      - name: Checkout revision policy script
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Enable CBHPM seed for one revision
        id: enable_seed
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DEFAULT_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_API_NAME }}
          INPUT_CONTAINER_APP_NAME: ${{ inputs.container_app_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          app_name="${INPUT_CONTAINER_APP_NAME:-$DEFAULT_CONTAINER_APP_NAME}"
          if [ -z "$RESOURCE_GROUP" ] || [ -z "$app_name" ]; then
            echo "AZURE_RESOURCE_GROUP and AZURE_CONTAINER_APP_API_NAME must be configured as repository variables." >&2
            exit 1
          fi

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"

          az containerapp update \
            --name "$app_name" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              Seed__CbhpmOnStartup=true \
              OperationalRun__CbhpmSeedRunId="$RUN_ID"

      - name: Wait for API health check
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ steps.enable_seed.outputs.app_name }}
        run: |
          set -euo pipefail

          fqdn="$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"

          if [ -z "$fqdn" ]; then
            echo "Container App does not expose an ingress FQDN; skipping HTTP health wait."
            exit 0
          fi

          for attempt in $(seq 1 60); do
            status="$(curl -k -sS -o /tmp/healthz.json -w "%{http_code}" "https://$fqdn/healthz" || true)"
            if [ "$status" = "200" ]; then
              echo "API became healthy after seed revision startup."
              exit 0
            fi

            echo "Waiting for /healthz, attempt $attempt/60, status=$status"
            sleep 10
          done

          echo "API health check did not return HTTP 200 after waiting." >&2
          cat /tmp/healthz.json 2>/dev/null || true
          exit 1

      - name: Disable CBHPM seed
        if: always() && steps.enable_seed.outputs.app_name != ''
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ steps.enable_seed.outputs.app_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              Seed__CbhpmOnStartup=false \
              OperationalRun__CbhpmSeedRunId="completed-$RUN_ID"

      - name: Enforce Production CURRENT/PREVIOUS revision policy
        if: ${{ success() && steps.enable_seed.outputs.app_name == 'hemodinks-api-prod' && vars.AZURE_RESOURCE_GROUP == 'rg-hemodinks-prod' }}
        env:
          API_NAME: hemodinks-api-prod
          API_RESOURCE_GROUP: rg-hemodinks-prod
        run: |
          set -euo pipefail
          traffic="$(az containerapp show \
            --name "$API_NAME" \
            --resource-group "$API_RESOURCE_GROUP" \
            --query properties.configuration.ingress.traffic \
            --output json)"
          total_weight="$(jq '[.[] | (.weight // 0)] | add // 0' <<<"$traffic")"
          current_revision="$(jq -r '[.[] | select((.weight // 0) == 100 and (.label == "blue" or .label == "green"))][0].revisionName // empty' <<<"$traffic")"
          previous_revision="$(jq -r --arg current "$current_revision" '[.[] | select(.revisionName != $current and (.weight // 0) == 0 and (.label == "blue" or .label == "green"))][0].revisionName // empty' <<<"$traffic")"
          production_count="$(jq '[.[] | select((.weight // 0) == 100 and (.label == "blue" or .label == "green"))] | length' <<<"$traffic")"
          if [ "$total_weight" -ne 100 ] || [ "$production_count" -ne 1 ] || [ -z "$current_revision" ] || [ -z "$previous_revision" ]; then
            echo "::error::Operational cleanup could not safely identify CURRENT_REVISION and PREVIOUS_REVISION."
            exit 4
          fi

          bash scripts/Enforce-ProductionRevisionPolicy.sh \
            "$current_revision" \
            "$previous_revision"
