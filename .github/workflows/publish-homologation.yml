name: Publish Homologation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnosticar, preparar artefatos ou publicar com seleção automática de schema
        type: choice
        required: true
        default: prepare
        options:
          - diagnose
          - diagnose-sql
          - prepare
          - publish

permissions:
  contents: read
  actions: read

concurrency:
  group: homologation-render-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  diagnose:
    if: (inputs.mode == 'diagnose' || inputs.mode == 'diagnose-sql') && github.ref == 'refs/heads/developer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homologation
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Render configuration without database access or deploy
        env:
          RENDER_API_KEY: ${{ secrets.HOMOLOGATION_RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.HOMOLOGATION_RENDER_SERVICE_ID }}
          EXPECTED_RENDER_HOST: hemodinks-api-1-90nb.onrender.com
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        run: python scripts/check_homologation.py
      - uses: actions/setup-dotnet@v6.0.0
        if: inputs.mode == 'diagnose-sql'
        with:
          dotnet-version: 10.0.x
      - name: Build read-only verifier without secrets
        if: inputs.mode == 'diagnose-sql'
        run: dotnet build tools/Hemodinks.SchemaGuard/Hemodinks.SchemaGuard.csproj --configuration Release --verbosity quiet
      - name: Diagnose SQL connection and history without deploying
        if: inputs.mode == 'diagnose-sql'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        run: dotnet tools/Hemodinks.SchemaGuard/bin/Release/net10.0/Hemodinks.SchemaGuard.dll
  prepare:
    name: Prepare audited migration artifacts (no database access)
    if: github.ref == 'refs/heads/developer' && inputs.mode != 'diagnose' && inputs.mode != 'diagnose-sql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=developer&event=push&status=success&per_page=100" \
            --jq '.workflow_runs | length > 0' | grep -qx true
      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore ./HemodinksAPI.slnx
          dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore
      - name: Audit migration chain and model
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -NoBuild -Configuration Release
      - name: Generate bundle and reviewable SQL without connecting to database
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations bundle \
            --context AppDbContext --self-contained --target-runtime linux-x64 \
            --configuration Release --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-efbundle
          dotnet tool run dotnet-ef migrations script \
            --context AppDbContext --idempotent --configuration Release --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/homologation-migrations.sql
      - name: Package read-only schema verifier
        run: dotnet publish ./tools/Hemodinks.SchemaGuard/Hemodinks.SchemaGuard.csproj --configuration Release --runtime linux-x64 --self-contained true --output ./artifacts/schema-guard
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: homologation-migrations-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  deploy:
    needs: prepare
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/developer'
    environment: homologation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.HOMOLOGATION_RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.HOMOLOGATION_RENDER_SERVICE_ID }}
      EXPECTED_RENDER_HOST: hemodinks-api-1-90nb.onrender.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: homologation-migrations-${{ github.sha }}
          path: artifacts
      - name: Validate homologation destination and deployment configuration
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          python scripts/check_homologation.py
      - name: Select deployment mode from schema state
        id: schema_mode
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          chmod +x artifacts/schema-guard/Hemodinks.SchemaGuard
          set +e
          ./artifacts/schema-guard/Hemodinks.SchemaGuard
          schema_status=$?
          set -e

          case "$schema_status" in
            0)
              echo "mode=deploy-only" >> "$GITHUB_OUTPUT"
              echo "Schema already matches this commit; deployment will not modify the database." >> "$GITHUB_STEP_SUMMARY"
              ;;
            10)
              echo "mode=migrate-and-deploy" >> "$GITHUB_OUTPUT"
              echo "Only known pending migrations were detected; homologation migrations will be applied automatically before deployment." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::error::Schema inspection could not be completed safely. Deployment blocked."
              exit 2
              ;;
            3)
              echo "::error::Migration history is inconsistent with this commit (unknown, missing, or out-of-order migration). Deployment blocked."
              exit 3
              ;;
            *)
              echo "::error::Schema guard returned unexpected exit code $schema_status. Deployment blocked."
              exit "$schema_status"
              ;;
          esac
      - name: Apply only known pending homologation migrations
        if: steps.schema_mode.outputs.mode == 'migrate-and-deploy'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          if [ -z "$ConnectionStrings__DefaultConnection" ]; then
            echo "::error::Configure HOMOLOGATION_SQL_CONNECTION_STRING in the homologation environment."
            exit 2
          fi
          chmod +x artifacts/hemodinks-efbundle
          ./artifacts/hemodinks-efbundle
      - name: Verify schema after automatic migration
        if: steps.schema_mode.outputs.mode == 'migrate-and-deploy'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.HOMOLOGATION_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          ./artifacts/schema-guard/Hemodinks.SchemaGuard
      - name: Enable deployment-managed schema after verification or migration
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data '{"value":"true"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/Database__SchemaManagedByDeployment"
      - name: Deploy the verified commit and wait for Render
        shell: bash
        run: |
          jq -n --arg commit "$GITHUB_SHA" '{commitId: $commit}' > deploy-request.json
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data-binary @deploy-request.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > deploy.json
          deploy_id=$(jq -er '.id' deploy.json)
          for attempt in {1..120}; do
            status=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" | jq -er '.status')
            case "$status" in
              live)
                echo "Homologation deployed: $GITHUB_SHA ($deploy_id)" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy failed: $status. Applied migrations were not rolled back."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy status timed out. Check Render before retrying."
          exit 1
