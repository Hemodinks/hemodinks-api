name: Apply Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-PRODUCTION to authorize the schema change
        required: true
        type: string
      backup_pitr_confirmed:
        description: Confirm that Azure SQL PITR/backup is available
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: production-container-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  migrate:
    name: Validate and apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: ${{ inputs.confirmation == 'APPLY-PRODUCTION' && inputs.backup_pitr_confirmed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore ./HemodinksAPI.slnx

      - name: Build
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ./HemodinksAPI.slnx --configuration Release --no-build --verbosity normal

      - name: Validate migration chain
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1 -NoBuild -Configuration Release

      - name: Generate reviewed SQL artifact and Linux bundle
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations bundle \
            --context AppDbContext \
            --self-contained \
            --target-runtime linux-x64 \
            --configuration Release \
            --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-efbundle
          dotnet tool run dotnet-ef migrations script \
            --context AppDbContext \
            --idempotent \
            --configuration Release \
            --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-production-migrations.sql

      - name: Upload SQL artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hemodinks-production-migrations-${{ github.sha }}
          path: |
            artifacts/hemodinks-efbundle
            artifacts/hemodinks-production-migrations.sql
          if-no-files-found: error

      - name: Select production schema action
        id: schema_mode
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          if [ -z "$ConnectionStrings__DefaultConnection" ]; then
            echo "::error::Configure AZURE_SQL_CONNECTION_STRING in the production environment secrets."
            exit 2
          fi

          set +e
          dotnet tools/Hemodinks.SchemaGuard/bin/Release/net10.0/Hemodinks.SchemaGuard.dll
          schema_status=$?
          set -e

          case "$schema_status" in
            0)
              echo "mode=no-migration" >> "$GITHUB_OUTPUT"
              echo "### Production schema check" >> "$GITHUB_STEP_SUMMARY"
              echo "Database migration history already matches this commit. No migration will be applied." >> "$GITHUB_STEP_SUMMARY"
              ;;
            10)
              echo "mode=apply-known-pending" >> "$GITHUB_OUTPUT"
              echo "### Production schema check" >> "$GITHUB_STEP_SUMMARY"
              echo "Only known pending migrations were detected. The reviewed EF bundle is authorized to run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::error::Production schema inspection could not be completed safely. No changes were applied."
              exit 2
              ;;
            3)
              echo "::error::Production migration history is inconsistent with this commit (unknown, missing, or out-of-order migration). No changes were applied."
              exit 3
              ;;
            *)
              echo "::error::SchemaGuard returned unexpected exit code $schema_status. Production migration blocked."
              exit "$schema_status"
              ;;
          esac

      - name: Apply only known pending migrations to Azure SQL
        if: steps.schema_mode.outputs.mode == 'apply-known-pending'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          chmod +x ./artifacts/hemodinks-efbundle
          ./artifacts/hemodinks-efbundle

      - name: Verify production schema after migration
        if: steps.schema_mode.outputs.mode == 'apply-known-pending'
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        shell: bash
        run: |
          dotnet tools/Hemodinks.SchemaGuard/bin/Release/net10.0/Hemodinks.SchemaGuard.dll
