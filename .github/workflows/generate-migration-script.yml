name: Generate Migration Script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-migration-script-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  generate:
    name: Generate idempotent SQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./HemodinksAPI.slnx

      - name: Build
        run: dotnet build ./HemodinksAPI.slnx --configuration Release --no-restore

      - name: Generate idempotent migration script
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations script \
            --context AppDbContext \
            --idempotent \
            --configuration Release \
            --no-build \
            --project ./HemodinksAPI.Infrastructure/HemodinksAPI.Infrastructure.csproj \
            --startup-project ./HemodinksAPI.Api/HemodinksAPI.Api.csproj \
            --output ./artifacts/hemodinks-migrations.sql

      - name: Upload SQL artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hemodinks-migrations-sql
          path: artifacts/hemodinks-migrations.sql
          if-no-files-found: error
          retention-days: 7
