name: Login integration E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-e2e:
    name: Login browser scenarios (12 required)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout compatible frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hemodinks/hemodinks-front
          # Includes Front #162 and the legal-bootstrap readiness fix (Front #189).
          # Keep the integration pair reviewable and reproducible.
          ref: e697dae7ef03f697d15fdc0ad8dbbaaf76b981f7
          path: .integration/frontend
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .integration/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: .integration/frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Build isolated API test host
        run: dotnet build HemodinksAPI.Tests/HemodinksAPI.Tests.csproj --configuration Release

      - name: Run login browser scenarios
        env:
          HEMODINKS_E2E_FRONT_PATH: ${{ github.workspace }}/.integration/frontend
        run: dotnet test HemodinksAPI.Tests/HemodinksAPI.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~LoginBrowserTests" --logger "trx;LogFileName=login-e2e.trx" --results-directory TestResults/login-e2e

      - name: Require all browser scenarios without skips
        if: always()
        run: python3 -B scripts/check-test-results.py --suite login-e2e TestResults/login-e2e/login-e2e.trx

      - name: Upload login test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: login-e2e-results
          path: TestResults/login-e2e/*.trx
          if-no-files-found: error
          retention-days: 7
