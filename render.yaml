services:
  - type: web
    name: hemodinks-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: CORECLR_ENABLE_PROFILING
        value: "1"
      - key: Database__RunMigrationsOnStartup
        value: "true"
      - key: Seed__CbhpmOnStartup
        value: "false"
      - key: Seed__UsersOnStartup
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__SecretKey
        sync: false
      - key: JwtSettings__Issuer
        value: HemodinksAPI
      - key: JwtSettings__Audience
        value: HemodinksAPI
      - key: JwtSettings__ExpirationMinutes
        value: 60
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_APP_NAME
        value: Hemodinks API
      - key: PasswordReset__UseEmail
        value: "true"
      - key: Frontend__ResetPasswordUrl
        value: https://hemodinks-saude.vercel.app/reset-password
      - key: AsyncQueues__Enabled
        value: "false"
      - key: AsyncQueues__PasswordResetEnabled
        value: "false"
      - key: AsyncQueues__FileExportEnabled
        value: "true"
      - key: AsyncQueues__ConnectionString
        sync: false
      - key: AsyncQueues__PasswordResetEmailQueueName
        value: password-reset-emails
      - key: AsyncQueues__FileExportQueueName
        value: file-export-jobs
      - key: Email__Provider
        value: GmailSmtp
      - key: Email__Smtp__Host
        value: smtp.gmail.com
      - key: Email__Smtp__Port
        value: 587
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__FromEmail
        sync: false
      - key: Email__FromName
        value: Hemodinks
      - key: AzureStorage__ConnectionString
        sync: false
      - key: AzureStorage__ContainerName
        value: profile-photos
      - key: AzureStorage__PublicBaseUrl
        sync: false
      - key: AzureStorage__MaxBytes
        value: 1048576
      - key: AzureStorage__PatientFilesContainerName
        value: patient-files
      - key: AzureStorage__PatientFilesPublicBaseUrl
        sync: false
      - key: AzureStorage__PatientFileMaxBytes
        value: 10485760
