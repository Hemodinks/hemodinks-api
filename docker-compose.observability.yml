services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: hemodinks-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - hemodinks-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hemodinks-mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - hemodinks-network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: hemodinks-aspire-dashboard
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DASHBOARD__OTLP__SUPPRESSUNSECUREDMESSAGE: "true"
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - hemodinks-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: hemodinks-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      aspire-dashboard:
        condition: service_started
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - hemodinks-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemodinks-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "${OBSERVABILITY_SQLSERVER_CONNECTION_STRING}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER:-HemodinksAPI}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-HemodinksAPI}"
      JwtSettings__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-60}"
      PasswordReset__UseEmail: "${PasswordReset__UseEmail:-true}"
      AsyncQueues__Enabled: "${AsyncQueues__Enabled:-false}"
      AsyncQueues__PasswordResetEnabled: "${AsyncQueues__PasswordResetEnabled:-false}"
      AsyncQueues__FileExportEnabled: "${AsyncQueues__FileExportEnabled:-true}"
      AsyncQueues__ConnectionString: "${ASYNC_QUEUES_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}"
      AsyncQueues__PasswordResetEmailQueueName: "${ASYNC_QUEUES_PASSWORD_RESET_EMAIL_QUEUE_NAME:-password-reset-emails}"
      AsyncQueues__FileExportQueueName: "${ASYNC_QUEUES_FILE_EXPORT_QUEUE_NAME:-file-export-jobs}"
      AzureStorage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}"
      AzureStorage__ContainerName: "${AZURE_STORAGE_CONTAINER_NAME:-profile-photos}"
      AzureStorage__PublicBaseUrl: "${AZURE_STORAGE_PUBLIC_BASE_URL:-}"
      AzureStorage__MaxBytes: "${AZURE_STORAGE_MAX_BYTES:-1048576}"
      AzureStorage__PatientFilesContainerName: "${AZURE_STORAGE_PATIENT_FILES_CONTAINER_NAME:-patient-files}"
      AzureStorage__PatientFilesPublicBaseUrl: "${AZURE_STORAGE_PATIENT_FILES_PUBLIC_BASE_URL:-}"
      AzureStorage__PatientFileMaxBytes: "${AZURE_STORAGE_PATIENT_FILE_MAX_BYTES:-10485760}"
      Email__Provider: "${Email__Provider:-GmailSmtp}"
      Email__Smtp__Host: "${Email__Smtp__Host:-smtp.gmail.com}"
      Email__Smtp__Port: "${Email__Smtp__Port:-587}"
      Email__Smtp__Username: "${Email__Smtp__Username:-hemodinks.gestao.saude@gmail.com}"
      Email__Smtp__Password: "${Email__Smtp__Password:-}"
      Email__FromEmail: "${Email__FromEmail:-hemodinks.gestao.saude@gmail.com}"
      Email__FromName: "${Email__FromName:-Hemodinks}"
      Frontend__ResetPasswordUrl: "${Frontend__ResetPasswordUrl:-http://localhost:5173/reset-password}"
      CORECLR_ENABLE_PROFILING: "${CORECLR_ENABLE_PROFILING:-0}"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
      NEW_RELIC_APP_NAME: "${NEW_RELIC_APP_NAME:-Hemodinks API Local}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_EXTERNAL_ENDPOINT: "${OTEL_EXPORTER_OTLP_EXTERNAL_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_EXTERNAL_PROTOCOL: "${OTEL_EXPORTER_OTLP_EXTERNAL_PROTOCOL:-grpc}"
      OTEL_EXPORTER_OTLP_EXTERNAL_HEADERS: "${OTEL_EXPORTER_OTLP_EXTERNAL_HEADERS:-}"
    ports:
      - "5000:5000"
    depends_on:
      azurite:
        condition: service_started
      sqlserver:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - hemodinks-network
    volumes:
      - ./logs:/app/logs

volumes:
  azurite_data:
  sqlserver_data:

networks:
  hemodinks-network:
    driver: bridge
